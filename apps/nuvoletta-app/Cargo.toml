[package]
name = "nuvoletta-app"
description = "Nuvoletta desktop application (Dioxus)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { version = "0.7", features = [] }
nuvoletta-app-core = { path = "../../crates/nuvoletta-app-core", version = "0.0.0" }
nuvoletta-core = { path = "../../crates/nuvoletta-core", version = "0.0.0" }
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["time"] }
webbrowser = "1"
zeroize.workspace = true

# Desktop-only: the config directory and the native folder dialog. Android has neither (see
# `platform.rs`).
[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
