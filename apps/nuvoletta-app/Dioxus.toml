[application]
name = "nuvoletta"
# Replaces dx's generated manifest and activity; see the comments in each file.
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"

[bundle]
identifier = "dev.nuvoletta.app"
publisher = "Nuvoletta"
short_description = "Private thoughts. Safely kept."
long_description = "Nuvoletta is a local-first encrypted notes app: your notes are encrypted on your device and synced only as ciphertext."
category = "Utility"
copyright = "Free software under the MIT licence."
icon = ["assets/icon-256.png", "assets/icon.ico"]

[android]
min_sdk = 28
target_sdk = 34
compile_sdk = 34

[bundle.windows.nsis]
# dx's template rejects pre-release versions (VIProductVersion needs X.X.X.X). The copy is generated
# by scripts/release/windows-nsis.sh from installer.nsi.in; see docs/RELEASING.md (Versioning).
template = "windows/installer.nsi"
