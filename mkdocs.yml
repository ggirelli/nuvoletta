site_name: nuvoletta
site_description: Private thoughts. Safely kept.
site_url: https://ggirelli.github.io/nuvoletta/
repo_url: https://github.com/ggirelli/nuvoletta
repo_name: ggirelli/nuvoletta
edit_uri: edit/main/docs/
copyright: Free software under the MIT licence.

theme:
  name: material
  # Only the repository link, without facts fetched from GitHub (see overrides/partials).
  custom_dir: overrides
  logo: assets/brand/02-app-icon.svg
  favicon: assets/brand/06a-favicon-32.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# No third-party requests: the privacy plugin downloads fonts and external assets at build time.
plugins:
  - search
  - privacy

exclude_docs: |
  requirements.txt

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Plan: plan.md
  - User guide:
      - Overview: user/index.md
      - Getting started: user/getting-started.md
      - Backup and restore: user/backup-and-restore.md
      - Sync setup: user/sync-setup.md
      - Lost or stolen device: user/device-loss.md
      - Recovery key: user/recovery-key.md
      - Security and privacy: user/security-and-privacy.md
      - Privacy policy: user/privacy-policy.md
  - Desktop and Android app: APP.md
  - WebDAV setup: WEBDAV.md
  - Design:
      - Threat model: THREAT_MODEL.md
      - Internal security review: SECURITY_REVIEW.md
      - Crypto format: CRYPTO_FORMAT.md
      - Sync protocol: SYNC_PROTOCOL.md
      - Storage format: STORAGE_FORMAT.md
      - Export format: EXPORT_FORMAT.md
      - Supply chain: SUPPLY_CHAIN.md
      - Decisions:
          - ADR 0001: ADR/0001-record-architecture-decisions.md
          - ADR 0002: ADR/0002-encrypted-at-rest-vault.md
          - ADR 0003: ADR/0003-markdown-dialect-and-wikilinks.md
          - ADR 0004: ADR/0004-desktop-app-architecture.md
          - ADR 0005: ADR/0005-sync-protocol.md
          - ADR 0006: ADR/0006-android-app.md
          - ADR 0007: ADR/0007-webdav-backend.md
          - ADR 0008: ADR/0008-device-join-and-header-adoption.md
  - Quality:
      - Performance and battery: PERFORMANCE.md
      - Accessibility: ACCESSIBILITY.md
  - Releasing and verifying downloads: RELEASING.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ggirelli/nuvoletta
      name: Source code
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/ggirelli
      name: Sponsor nuvoletta on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/ggirelli
      name: Support nuvoletta on Ko-fi
