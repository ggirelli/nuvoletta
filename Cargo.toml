[workspace]
members = ["crates/*"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ggirelli/nuvoletta"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
getrandom = "0.3"
hkdf = "0.12.4"
hmac = "0.12.1"
minicbor = { version = "2", features = ["derive", "std"] }
proptest = "1"
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6"
thiserror = "2"
unicode-normalization = "0.1.24"
zeroize = { version = "1.8", features = ["derive"] }

# Keep crypto dependencies fast in debug test runs (Argon2 is slow unoptimised).
[profile.dev.package."*"]
opt-level = 3
