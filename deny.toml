[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Report unmaintained and unsound crates anywhere in the tree, not only direct dependencies. The
# few known notices below are ignored explicitly, with reasons.
unmaintained = "all"
unsound = "all"
# All three come only through the Dioxus desktop stack (nuvoletta-app), not through any crate that
# handles keys or note data. They are "unmaintained" notices, not vulnerabilities. Revisit when
# Dioxus/wry update; remove each entry once its crate leaves the tree.
ignore = [
    # fxhash: selectors <- kuchikiki <- wry (devtools feature of dioxus-desktop)
    { id = "RUSTSEC-2025-0057", reason = "unmaintained; only via wry's HTML helper in the webview stack" },
    # paste: rav1e <- ravif <- image <- dioxus-desktop (icon/image decoding)
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro; build-time only, via image's AVIF encoder" },
    # proc-macro-error: glib-macros <- gtk <- tao/wry (Linux windowing)
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro; build-time only, via the GTK bindings" },
    # glib 0.18.5 (GHSA-wrw7-89jp-8q8g): gtk 0.18 <- tao/wry/muda <- dioxus-desktop 0.7 pins it; the patched glib 0.20 cannot be selected without a Dioxus update.
    # No crate in the lockfile calls VariantStrIter, and nuvoletta does not use glib directly.
    { id = "RUSTSEC-2024-0429", reason = "unsound VariantStrIter in glib 0.18; pinned by gtk 0.18 via dioxus-desktop (no patched path); no crate in the tree calls VariantStrIter" },
    # rand 0.7.3 (GHSA-cq8v-f236-94qc): phf_generator 0.8 <- phf_codegen <- selectors build script (wry); pinned by phf_generator, no patched path without a Dioxus update.
    # The advisory needs the `log` feature and a custom logger calling rand::rng(); this copy has no `log` feature, no logger, and runs only at build time.
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7.3 is build-time only (selectors' phf_codegen); no `log` feature and no custom logger" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # Weak, file-level copyleft. Only in the Dioxus/wry webview stack and `dirs` (cssparser,
    # selectors, dtoa-short, option-ext); used unmodified as dependencies, so it does not affect
    # the licence of Nuvoletta's own code. Needed by `nuvoletta-app` only.
    "MPL-2.0",
    # BSD-like (University of Illinois/NCSA); libfuzzer-sys, pulled by Dioxus via image/rav1e.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
# Duplicates mostly come from the Dioxus/wry/GTK stack (windows-*, phf, syn, ...). They are shown
# as warnings so that a new duplicate of a crate we use directly is noticed in review; making them
# errors would block on upstream releases. docs/SUPPLY_CHAIN.md describes how to handle one.
multiple-versions = "warn"
wildcards = "deny"
# Transport and cryptography use rustls with ring and the RustCrypto crates only. A system
# TLS or OpenSSL dependency would add a second, unreviewed trust path (and C code).
deny = [
    # `wrappers` names the only crates allowed to depend on each one. native-tls comes from
    # tungstenite, i.e. the Dioxus desktop devtools websocket (localhost, no notes or keys); the
    # sync transport (ureq + rustls) and the crypto crates never touch it.
    { crate = "native-tls", wrappers = ["tungstenite"], reason = "TLS is rustls only; tolerated only via Dioxus' devtools websocket" },
    { crate = "openssl", wrappers = ["native-tls"], reason = "TLS is rustls only" },
    { crate = "openssl-sys", wrappers = ["native-tls", "openssl"], reason = "TLS is rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies at all: everything comes from crates.io with a checksum in Cargo.lock.
allow-git = []
