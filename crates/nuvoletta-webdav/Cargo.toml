[package]
name = "nuvoletta-webdav"
description = "WebDAV sync backend of Nuvoletta: a provider for credentials that can read and create but never delete or overwrite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# An in-process TLS WebDAV server for tests (also used by nuvoletta-app-core's tests).
test-server = ["dep:rcgen"]

[dependencies]
getrandom.workspace = true
nuvoletta-sync = { path = "../nuvoletta-sync", version = "0.0.0" }
percent-encoding = "2"
quick-xml = "0.42"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize.workspace = true

[dev-dependencies]
nuvoletta-webdav = { path = ".", features = ["test-server"] }
nuvoletta-core = { path = "../nuvoletta-core", version = "0.0.0" }
nuvoletta-crypto = { path = "../nuvoletta-crypto", version = "0.0.0" }
nuvoletta-storage = { path = "../nuvoletta-storage", version = "0.0.0" }
tempfile = "3"
