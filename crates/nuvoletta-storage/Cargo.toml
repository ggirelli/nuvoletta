[package]
name = "nuvoletta-storage"
description = "Filesystem vault of Nuvoletta: atomic persistence and note CRUD over encrypted envelopes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
nuvoletta-core = { path = "../nuvoletta-core", version = "0.1.0-rc.1" }
nuvoletta-crypto = { path = "../nuvoletta-crypto", version = "0.1.0-rc.1" }
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / ELOOP constants for race-free symlink refusal (no unsafe needed).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
