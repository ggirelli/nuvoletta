name: Nightly

# Slower and wider checks than the pull request CI: the desktop app on all three desktop platforms,
# the Android APK, and the full-cost (slow) tests on Linux.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      - name: Build the workspace, including the desktop app (release)
        run: cargo build --workspace --locked --release
      - name: Test the workspace
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@just
        if: runner.os == 'Linux'
      - name: Slow tests (full-cost Argon2id vectors)
        if: runner.os == 'Linux'
        run: just test-slow

  # Proves the Android app still builds (and requests only the INTERNET permission). Not run on pull
  # requests: installing dx and running Gradle takes several minutes. Nothing runs the APK in CI.
  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      # The runner image provides the Android SDK and NDK (ANDROID_HOME, ANDROID_NDK_HOME).
      - uses: actions/cache@v4
        id: dx
        with:
          path: ~/.cargo/bin/dx
          key: dx-0.7.10
      - name: Install the Dioxus CLI
        if: steps.dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: just android
      - run: just android-permissions
