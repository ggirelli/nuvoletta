name: Nightly

# Slower and wider checks than the pull request CI: the desktop app on all three desktop platforms,
# and the full-cost (slow) tests on Linux.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      - name: Build the workspace, including the desktop app (release)
        run: cargo build --workspace --locked --release
      - name: Test the workspace
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@just
        if: runner.os == 'Linux'
      - name: Slow tests (full-cost Argon2id vectors)
        if: runner.os == 'Linux'
        run: just test-slow
