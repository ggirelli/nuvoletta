name: Linux desktop dependencies
description: System libraries that the Dioxus desktop app (GTK, WebKitGTK) needs to compile.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
